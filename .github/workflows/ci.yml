name: BootCtrl EdgeOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: edgeos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tflite-tests:
    name: Test / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_DIR: build/ci-debug-tflite-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Required Submodules
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git submodule sync -- 4diacFORTE
          git -c protocol.version=2 submodule update --init --depth=1 4diacFORTE

      - name: Install Build Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            g++ \
            gcc \
            make \
            pkg-config \
            git \
            python3 \
            python3-pip \
            libboost-test-dev

      - name: Install CMake 3.30+
        run: |
          set -euxo pipefail
          python3 -m pip install --user --break-system-packages "cmake>=3.30,<3.32"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/cmake" --version

      - name: Provision TensorFlow Lite
        id: tflite
        run: |
          set -euxo pipefail

          include_dir=""
          library_path=""
          flatbuffers_include=""
          extra_libraries=""

          if apt-cache show libtensorflow-lite-dev >/dev/null 2>&1; then
            sudo apt-get install -y libtensorflow-lite-dev
            include_dir="$(dpkg -L libtensorflow-lite-dev | grep '/tensorflow/lite/interpreter.h$' | head -n1 | sed 's#/tensorflow/lite/interpreter.h##')"
            library_path="$(ldconfig -p | awk '/libtensorflowlite\.so/{print $NF; exit}')"
            if [ -f "${include_dir}/flatbuffers/flatbuffers.h" ]; then
              flatbuffers_include="${include_dir}"
            elif [ -f "/usr/include/flatbuffers/flatbuffers.h" ]; then
              flatbuffers_include="/usr/include"
            fi
          fi

          if [ -z "${include_dir}" ] || [ -z "${library_path}" ] || [ ! -f "${include_dir}/tensorflow/lite/interpreter.h" ] || [ ! -f "${library_path}" ]; then
            rm -rf third_party/tensorflow third_party/tflite-build third_party/flatbuffers
            git clone --depth=1 --branch v2.19.1 https://github.com/tensorflow/tensorflow.git third_party/tensorflow
            git clone --depth=1 --branch v24.3.25 https://github.com/google/flatbuffers.git third_party/flatbuffers
            cmake -S third_party/tensorflow/tensorflow/lite \
              -B third_party/tflite-build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DTFLITE_ENABLE_XNNPACK=OFF \
              -DFETCHCONTENT_SOURCE_DIR_FLATBUFFERS="${GITHUB_WORKSPACE}/third_party/flatbuffers"
            cmake --build third_party/tflite-build --target tensorflow-lite -j"$(nproc)"

            mapfile -t _tflite_targets < <(ninja -C third_party/tflite-build -t targets all | cut -d: -f1)
            declare -A _tflite_target_set=()
            for _tflite_target in "${_tflite_targets[@]}"; do
              _tflite_target_set["${_tflite_target}"]=1
            done
            _required_absl_targets=(
              absl_log_internal_message
              absl_log_internal_format
              absl_log_internal_globals
              absl_log_internal_check_op
              absl_log_internal_conditions
              absl_log_internal_log_sink_set
              absl_log_internal_nullguard
              absl_log_internal_proto
              absl_log_entry
              absl_log_sink
              absl_log_flags
              absl_log_globals
              absl_log_initialize
              absl_log_severity
            )
            _build_absl_targets=()
            for _candidate_target in "${_required_absl_targets[@]}"; do
              if [ "${_tflite_target_set[${_candidate_target}]+x}" = "x" ]; then
                _build_absl_targets+=("${_candidate_target}")
              fi
            done
            if [ "${#_build_absl_targets[@]}" -gt 0 ]; then
              cmake --build third_party/tflite-build --target "${_build_absl_targets[@]}" -j"$(nproc)"
            fi

            include_dir="${GITHUB_WORKSPACE}/third_party/tensorflow"
            library_path="$(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libtensorflow-lite.so' -o -name 'libtensorflowlite.so' \) | head -n1)"
            if [ -z "${library_path}" ]; then
              library_path="$(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libtensorflow-lite.a' -o -name 'libtensorflowlite.a' \) | head -n1)"
            fi
            flatbuffers_include="${GITHUB_WORKSPACE}/third_party/flatbuffers/include"

            mapfile -t _absl_libs < <(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libabsl*.so*' -o -name 'libabsl*.a' \) | sort -u)
            if [ "${#_absl_libs[@]}" -gt 0 ]; then
              extra_libraries="$(printf '%s;' "${_absl_libs[@]}")"
              extra_libraries="${extra_libraries%;}"
            fi
          fi

          test -n "${include_dir}"
          test -n "${library_path}"
          test -f "${include_dir}/tensorflow/lite/interpreter.h"
          test -f "${library_path}"
          if [ -n "${flatbuffers_include}" ]; then
            test -f "${flatbuffers_include}/flatbuffers/flatbuffers.h"
          fi
          if [ -n "${extra_libraries}" ]; then
            IFS=';' read -r -a _extra_lib_array <<< "${extra_libraries}"
            for _extra_lib in "${_extra_lib_array[@]}"; do
              test -f "${_extra_lib}"
            done
          fi

          echo "include_dir=${include_dir}" >> "${GITHUB_OUTPUT}"
          echo "library_path=${library_path}" >> "${GITHUB_OUTPUT}"
          echo "flatbuffers_include=${flatbuffers_include}" >> "${GITHUB_OUTPUT}"
          echo "extra_libraries=${extra_libraries}" >> "${GITHUB_OUTPUT}"

      - name: Configure (Debug + TFLite)
        run: |
          set -euxo pipefail
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBOOTCTRL_ENABLE_EDGEML=ON \
            -DFORTE_TESTS=ON \
            -DFORTE_EDGEML_BACKEND_TFLITE=ON \
            -DFORTE_EDGEML_TFLITE_INCLUDE_DIR="${{ steps.tflite.outputs.include_dir }}" \
            -DFORTE_EDGEML_TFLITE_LIBRARY="${{ steps.tflite.outputs.library_path }}" \
            -DFORTE_EDGEML_TFLITE_EXTRA_LIBRARIES="${{ steps.tflite.outputs.extra_libraries }}" \
            -DFORTE_EDGEML_TFLITE_FLATBUFFERS_INCLUDE_DIR="${{ steps.tflite.outputs.flatbuffers_include }}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q 'FORTE_EDGEML_BACKEND_TFLITE_ACTIVE:INTERNAL=ON' "${BUILD_DIR}/CMakeCache.txt"

      - name: Build
        run: |
          set -euxo pipefail
          cmake --build "${BUILD_DIR}" -j"$(nproc)"

      - name: Run Full Test Suite
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}/artifacts/logs"
          "${BUILD_DIR}/4diacFORTE/tests/forte_test" \
            > "${BUILD_DIR}/artifacts/logs/forte_test_full.log" 2>&1

      - name: Run Stress Suite
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}/artifacts/logs"
          : > "${BUILD_DIR}/artifacts/logs/forte_test_stress.log"
          for iteration in $(seq 1 5); do
            echo "[stress] iteration=${iteration}" >> "${BUILD_DIR}/artifacts/logs/forte_test_stress.log"
            "${BUILD_DIR}/4diacFORTE/tests/forte_test" \
              --run_test='ModelRegistryTests/modelRegistryConcurrentAccess' \
              --report_level=no \
              --log_level=nothing \
              >> "${BUILD_DIR}/artifacts/logs/forte_test_stress.log" 2>&1
            "${BUILD_DIR}/4diacFORTE/tests/forte_test" \
              --run_test='ModelRegistryTests/edgeMLRuntimeConcurrentLoadInferUnload' \
              --report_level=no \
              --log_level=nothing \
              >> "${BUILD_DIR}/artifacts/logs/forte_test_stress.log" 2>&1
          done

      - name: Run TFLite Backend Focused Suite
        run: |
          set -euxo pipefail
          "${BUILD_DIR}/4diacFORTE/tests/forte_test" \
            --run_test='TFLiteBackendTests/*' \
            > "${BUILD_DIR}/artifacts/logs/forte_test_tflite.log" 2>&1

      - name: Upload Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeos-test-diagnostics-debug-tflite-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.BUILD_DIR }}/artifacts/logs/*.log
            ${{ env.BUILD_DIR }}/CMakeCache.txt

  release-artifacts:
    name: Release Artifact / ${{ matrix.arch }}
    needs: tflite-tests
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: debian:bookworm
          - arch: arm64
            runner: ubuntu-24.04-arm
            container: debian:bookworm
    env:
      BUILD_DIR: build/ci-release-tflite-${{ matrix.arch }}

    steps:
      - name: Install Core VCS Tools
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Build Dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y \
            ca-certificates \
            ninja-build \
            g++ \
            gcc \
            make \
            pkg-config \
            python3 \
            python3-pip

      - name: Initialize Required Submodules
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git ca-certificates
          fi
          git --version
          test -d .git
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git submodule sync -- 4diacFORTE
          git -c protocol.version=2 submodule update --init --depth=1 4diacFORTE

      - name: Install CMake 3.30+
        run: |
          set -euxo pipefail
          python3 -m pip install --user --break-system-packages "cmake>=3.30,<3.32"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/cmake" --version

      - name: Provision TensorFlow Lite
        id: tflite
        run: |
          set -euxo pipefail

          include_dir=""
          library_path=""
          flatbuffers_include=""
          extra_libraries=""

          if apt-cache show libtensorflow-lite-dev >/dev/null 2>&1; then
            apt-get install -y libtensorflow-lite-dev
            include_dir="$(dpkg -L libtensorflow-lite-dev | grep '/tensorflow/lite/interpreter.h$' | head -n1 | sed 's#/tensorflow/lite/interpreter.h##')"
            library_path="$(ldconfig -p | awk '/libtensorflowlite\.so/{print $NF; exit}')"
            if [ -f "${include_dir}/flatbuffers/flatbuffers.h" ]; then
              flatbuffers_include="${include_dir}"
            elif [ -f "/usr/include/flatbuffers/flatbuffers.h" ]; then
              flatbuffers_include="/usr/include"
            fi
          fi

          if [ -z "${include_dir}" ] || [ -z "${library_path}" ] || [ ! -f "${include_dir}/tensorflow/lite/interpreter.h" ] || [ ! -f "${library_path}" ]; then
            rm -rf third_party/tensorflow third_party/tflite-build third_party/flatbuffers
            git clone --depth=1 --branch v2.19.1 https://github.com/tensorflow/tensorflow.git third_party/tensorflow
            git clone --depth=1 --branch v24.3.25 https://github.com/google/flatbuffers.git third_party/flatbuffers
            cmake -S third_party/tensorflow/tensorflow/lite \
              -B third_party/tflite-build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DTFLITE_ENABLE_XNNPACK=OFF \
              -DFETCHCONTENT_SOURCE_DIR_FLATBUFFERS="${GITHUB_WORKSPACE}/third_party/flatbuffers"
            cmake --build third_party/tflite-build --target tensorflow-lite -j"$(nproc)"

            mapfile -t _tflite_targets < <(ninja -C third_party/tflite-build -t targets all | cut -d: -f1)
            declare -A _tflite_target_set=()
            for _tflite_target in "${_tflite_targets[@]}"; do
              _tflite_target_set["${_tflite_target}"]=1
            done
            _required_absl_targets=(
              absl_log_internal_message
              absl_log_internal_format
              absl_log_internal_globals
              absl_log_internal_check_op
              absl_log_internal_conditions
              absl_log_internal_log_sink_set
              absl_log_internal_nullguard
              absl_log_internal_proto
              absl_log_entry
              absl_log_sink
              absl_log_flags
              absl_log_globals
              absl_log_initialize
              absl_log_severity
            )
            _build_absl_targets=()
            for _candidate_target in "${_required_absl_targets[@]}"; do
              if [ "${_tflite_target_set[${_candidate_target}]+x}" = "x" ]; then
                _build_absl_targets+=("${_candidate_target}")
              fi
            done
            if [ "${#_build_absl_targets[@]}" -gt 0 ]; then
              cmake --build third_party/tflite-build --target "${_build_absl_targets[@]}" -j"$(nproc)"
            fi

            include_dir="${GITHUB_WORKSPACE}/third_party/tensorflow"
            library_path="$(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libtensorflow-lite.so' -o -name 'libtensorflowlite.so' \) | head -n1)"
            if [ -z "${library_path}" ]; then
              library_path="$(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libtensorflow-lite.a' -o -name 'libtensorflowlite.a' \) | head -n1)"
            fi
            flatbuffers_include="${GITHUB_WORKSPACE}/third_party/flatbuffers/include"

            mapfile -t _absl_libs < <(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f \( -name 'libabsl*.so*' -o -name 'libabsl*.a' \) | sort -u)
            if [ "${#_absl_libs[@]}" -gt 0 ]; then
              extra_libraries="$(printf '%s;' "${_absl_libs[@]}")"
              extra_libraries="${extra_libraries%;}"
            fi
          fi

          test -n "${include_dir}"
          test -n "${library_path}"
          test -f "${include_dir}/tensorflow/lite/interpreter.h"
          test -f "${library_path}"
          if [ -n "${flatbuffers_include}" ]; then
            test -f "${flatbuffers_include}/flatbuffers/flatbuffers.h"
          fi
          if [ -n "${extra_libraries}" ]; then
            IFS=';' read -r -a _extra_lib_array <<< "${extra_libraries}"
            for _extra_lib in "${_extra_lib_array[@]}"; do
              test -f "${_extra_lib}"
            done
          fi

          echo "include_dir=${include_dir}" >> "${GITHUB_OUTPUT}"
          echo "library_path=${library_path}" >> "${GITHUB_OUTPUT}"
          echo "flatbuffers_include=${flatbuffers_include}" >> "${GITHUB_OUTPUT}"
          echo "extra_libraries=${extra_libraries}" >> "${GITHUB_OUTPUT}"

      - name: Configure (Release + TFLite)
        run: |
          set -euxo pipefail
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOTCTRL_ENABLE_EDGEML=ON \
            -DFORTE_TESTS=OFF \
            -DFORTE_EDGEML_BACKEND_TFLITE=ON \
            -DFORTE_EDGEML_TFLITE_INCLUDE_DIR="${{ steps.tflite.outputs.include_dir }}" \
            -DFORTE_EDGEML_TFLITE_LIBRARY="${{ steps.tflite.outputs.library_path }}" \
            -DFORTE_EDGEML_TFLITE_EXTRA_LIBRARIES="${{ steps.tflite.outputs.extra_libraries }}" \
            -DFORTE_EDGEML_TFLITE_FLATBUFFERS_INCLUDE_DIR="${{ steps.tflite.outputs.flatbuffers_include }}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q 'FORTE_EDGEML_BACKEND_TFLITE_ACTIVE:INTERNAL=ON' "${BUILD_DIR}/CMakeCache.txt"

      - name: Build
        run: |
          set -euxo pipefail
          cmake --build "${BUILD_DIR}" -j"$(nproc)"

      - name: Create Deployable Tarball
        run: |
          set -euxo pipefail
          package_name="bootctrl-edgeos-${{ matrix.arch }}-release-tflite"
          package_root="${BUILD_DIR}/package/${package_name}"
          artifact_dir="${BUILD_DIR}/artifacts"
          tflite_lib="${{ steps.tflite.outputs.library_path }}"
          tflite_extra_libs="${{ steps.tflite.outputs.extra_libraries }}"
          safe_copy() {
            local src="$1"
            local dst="$2"
            local mode="${3:-file}"
            if [ "${mode}" = "dir" ]; then
              if [ -d "${src}" ]; then
                cp -r "${src}" "${dst}"
              else
                echo "[package] skip missing directory: ${src}"
              fi
            else
              if [ -f "${src}" ]; then
                cp "${src}" "${dst}"
              else
                echo "[package] skip missing file: ${src}"
              fi
            fi
          }

          rm -rf "${BUILD_DIR}/package"
          mkdir -p "${package_root}/bin" "${package_root}/lib" "${package_root}/configurations" "${artifact_dir}"

          cp "${BUILD_DIR}/4diacFORTE/forte" "${package_root}/bin/forte"
          if [ -f "README.md" ]; then
            cp README.md "${package_root}/README.md"
          else
            printf '%s\n' \
              "BootCtrl EdgeOS Release Artifact" \
              "README.md was not available in this CI checkout." \
              > "${package_root}/README.md"
          fi
          safe_copy "docs/DEPLOYMENT.md" "${package_root}/DEPLOYMENT.md"
          if [ ! -f "${package_root}/DEPLOYMENT.md" ]; then
            printf '%s\n' \
              "Deployment guide was not available in this CI checkout." \
              "Run ./run-forte.sh to start the runtime." \
              > "${package_root}/DEPLOYMENT.md"
          fi
          safe_copy "configurations/examples" "${package_root}/configurations/examples" "dir"
          safe_copy "configurations/templates" "${package_root}/configurations/templates" "dir"
          safe_copy "configurations/README.md" "${package_root}/configurations/README.md"

          if [[ "${tflite_lib}" == *.so* ]]; then
            tflite_lib_real="$(readlink -f "${tflite_lib}")"
            cp "${tflite_lib_real}" "${package_root}/lib/"
            for candidate in "$(dirname "${tflite_lib_real}")"/libtensorflow-lite.so* "$(dirname "${tflite_lib_real}")"/libtensorflowlite.so*; do
              if [ -f "${candidate}" ] || [ -L "${candidate}" ]; then
                cp -P "${candidate}" "${package_root}/lib/" || true
              fi
            done
          fi
          if [ -n "${tflite_extra_libs}" ]; then
            IFS=';' read -r -a _extra_lib_array <<< "${tflite_extra_libs}"
            for _extra_lib in "${_extra_lib_array[@]}"; do
              if [[ "${_extra_lib}" == *.so* ]] && { [ -f "${_extra_lib}" ] || [ -L "${_extra_lib}" ]; }; then
                cp -P "${_extra_lib}" "${package_root}/lib/" || true
              fi
            done
          fi
          # Package all non-system shared libraries generated by the TFLite build tree
          # so runtime dependencies such as farmhash/cpuinfo/fft libs are not omitted.
          if [ -d "${GITHUB_WORKSPACE}/third_party/tflite-build" ]; then
            while IFS= read -r _dep_so; do
              cp -P "${_dep_so}" "${package_root}/lib/" || true
            done < <(find "${GITHUB_WORKSPACE}/third_party/tflite-build" -type f -name 'lib*.so*' | sort -u)
          fi

          cat > "${package_root}/run-forte.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          exec "${SCRIPT_DIR}/bin/forte" "$@"
          RUNNER
          chmod +x "${package_root}/run-forte.sh"

          cat > "${package_root}/BUILD_INFO.txt" <<INFO
          GIT_SHA=${GITHUB_SHA}
          BUILD_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_ID=${GITHUB_RUN_ID}
          ARCH=${{ matrix.arch }}
          BACKEND=TFLITE
          CONFIG=Release
          INFO

          tar -C "${BUILD_DIR}/package" -czf "${artifact_dir}/${package_name}.tar.gz" "${package_name}"
          sha256sum "${artifact_dir}/${package_name}.tar.gz" > "${artifact_dir}/${package_name}.tar.gz.sha256"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeos-release-tflite-${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.BUILD_DIR }}/artifacts/*.tar.gz
            ${{ env.BUILD_DIR }}/artifacts/*.sha256
            ${{ env.BUILD_DIR }}/CMakeCache.txt

  publish-ghcr:
    name: Publish Release Artifacts to GHCR
    needs: release-artifacts
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: edgeos-release-tflite-*
          path: ghcr-artifacts
          merge-multiple: true

      - name: Validate Downloaded Artifacts
        run: |
          set -euxo pipefail
          ls -la ghcr-artifacts
          find ghcr-artifacts -maxdepth 3 -type f | sort
          test -n "$(find ghcr-artifacts -type f -name 'bootctrl-edgeos-*-release-tflite.tar.gz' -print -quit)"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: |
          set -euxo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Artifacts with Stable and Immutable Tags
        run: |
          set -euxo pipefail

          owner_lower="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lower="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          package_ref="ghcr.io/${owner_lower}/${repo_lower}-artifacts"
          short_sha="${GITHUB_SHA:0:12}"
          created_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mapfile -t tarballs < <(find ghcr-artifacts -type f -name 'bootctrl-edgeos-*-release-tflite.tar.gz' | sort)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No release tarballs found in downloaded artifacts." >&2
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            filename="$(basename "${tarball}")"
            arch="$(echo "${filename}" | sed -E 's/^bootctrl-edgeos-([A-Za-z0-9_]+)-release-tflite\.tar\.gz$/\1/')"
            sha_file="${tarball}.sha256"

            if [ ! -f "${sha_file}" ]; then
              echo "Missing checksum file for ${filename}" >&2
              exit 1
            fi

            latest_tag="latest-${arch}"
            immutable_tag="sha-${short_sha}-${arch}"

            for tag in "${latest_tag}" "${immutable_tag}"; do
              oras push "${package_ref}:${tag}" \
                --artifact-type "application/vnd.bootctrl.edgeos.release.v1+tar" \
                --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.created=${created_utc}" \
                --annotation "org.opencontainers.image.description=BootCtrl EdgeOS release artifact (${arch}, TFLite backend)" \
                "${tarball}:application/gzip" \
                "${sha_file}:text/plain"
            done

            {
              echo "- ${arch}:"
              echo "  - stable: \`${package_ref}:${latest_tag}\`"
              echo "  - immutable: \`${package_ref}:${immutable_tag}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          done
